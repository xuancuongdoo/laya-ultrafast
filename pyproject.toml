[project]
name = "laya-ultrafast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating — powered by local Laya."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["browser-harness", "httpx>=0.28,<1", "laya"]

[project.scripts]
laya-ultrafast = "laya_ultrafast.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
